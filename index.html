<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-shell">
        <header class="app-header panel">
            <div>
                <h1>タスク管理ダッシュボード</h1>
                <p class="muted">日々のタスクを整理し、進捗を可視化できます。</p>
            </div>
            <p id="today-label" class="today-label"></p>
        </header>

        <main class="layout">
            <section class="panel form-panel">
                <h2>タスク追加 / 編集</h2>
                <form id="task-form">
                    <input type="hidden" id="task-id">

                    <label for="task-title">タイトル *</label>
                    <input id="task-title" name="task-title" type="text" maxlength="80" required placeholder="例: 企画書の提出">

                    <label for="task-description">詳細</label>
                    <textarea id="task-description" name="task-description" rows="4" maxlength="500" placeholder="メモや補足を入力"></textarea>

                    <div class="row">
                        <div>
                            <label for="task-due-date">期限</label>
                            <input id="task-due-date" name="task-due-date" type="date">
                        </div>
                        <div>
                            <label for="task-priority">優先度</label>
                            <select id="task-priority" name="task-priority">
                                <option value="low">低</option>
                                <option value="medium" selected>中</option>
                                <option value="high">高</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label for="task-status">ステータス</label>
                            <select id="task-status" name="task-status">
                                <option value="todo" selected>未着手</option>
                                <option value="doing">進行中</option>
                                <option value="done">完了</option>
                            </select>
                        </div>
                        <div>
                            <label for="task-importance">重要度ランク</label>
                            <select id="task-importance" name="task-importance">
                                <option value="s">S（最重要）</option>
                                <option value="a">A（重要）</option>
                                <option value="b" selected>B（通常）</option>
                                <option value="c">C（低め）</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label for="task-category">カテゴリ</label>
                            <input id="task-category" name="task-category" type="text" maxlength="30" placeholder="例: 仕事 / 学習">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button id="save-task-btn" type="submit" class="btn btn-primary">タスクを保存</button>
                        <button id="reset-form-btn" type="button" class="btn btn-secondary">入力をリセット</button>
                    </div>
                </form>
            </section>

            <section class="panel dashboard-panel">
                <h2>ダッシュボード</h2>
                <div class="metric-grid">
                    <article class="metric-card">
                        <p class="metric-label">総タスク数</p>
                        <p id="metric-total" class="metric-value">0</p>
                    </article>
                    <article class="metric-card">
                        <p class="metric-label">進行中</p>
                        <p id="metric-doing" class="metric-value">0</p>
                    </article>
                    <article class="metric-card">
                        <p class="metric-label">完了済み</p>
                        <p id="metric-done" class="metric-value">0</p>
                    </article>
                    <article class="metric-card metric-alert">
                        <p class="metric-label">期限切れ</p>
                        <p id="metric-overdue" class="metric-value">0</p>
                    </article>
                </div>

                <div class="completion-section">
                    <div class="completion-header">
                        <span>完了率</span>
                        <span id="completion-text">0%</span>
                    </div>
                    <div class="completion-bar-wrap">
                        <div id="completion-bar" class="completion-bar"></div>
                    </div>
                </div>

                <div>
                    <h3>優先度内訳</h3>
                    <ul id="priority-breakdown" class="breakdown-list"></ul>
                </div>

                <div>
                    <h3>重要度ランク内訳</h3>
                    <ul id="importance-breakdown" class="breakdown-list"></ul>
                </div>

                <div class="alert-section">
                    <h3>アラート</h3>
                    <div class="alert-controls">
                        <label class="inline-check" for="alert-enabled">
                            <input id="alert-enabled" type="checkbox">
                            ブラウザ通知を有効化
                        </label>
                        <button id="notification-permission-btn" type="button" class="btn btn-secondary">通知を許可</button>
                    </div>
                    <p id="alert-permission-text" class="muted"></p>
                    <ul id="alert-list" class="alert-list"></ul>
                </div>
            </section>
        </main>

        <section class="panel controls-panel">
            <h2>検索 / 絞り込み</h2>
            <div class="controls-grid">
                <div>
                    <label for="search-input">キーワード</label>
                    <input id="search-input" type="text" placeholder="タイトル・詳細・カテゴリで検索">
                </div>
                <div>
                    <label for="filter-status">ステータス</label>
                    <select id="filter-status">
                        <option value="all">すべて</option>
                        <option value="todo">未着手</option>
                        <option value="doing">進行中</option>
                        <option value="done">完了</option>
                    </select>
                </div>
                <div>
                    <label for="filter-priority">優先度</label>
                    <select id="filter-priority">
                        <option value="all">すべて</option>
                        <option value="high">高</option>
                        <option value="medium">中</option>
                        <option value="low">低</option>
                    </select>
                </div>
                <div>
                    <label for="filter-importance">重要度ランク</label>
                    <select id="filter-importance">
                        <option value="all">すべて</option>
                        <option value="s">S</option>
                        <option value="a">A</option>
                        <option value="b">B</option>
                        <option value="c">C</option>
                    </select>
                </div>
                <div>
                    <label for="sort-by">並び順</label>
                    <select id="sort-by">
                        <option value="created_desc">作成日が新しい順</option>
                        <option value="created_asc">作成日が古い順</option>
                        <option value="due_asc">期限が近い順</option>
                        <option value="due_desc">期限が遠い順</option>
                        <option value="importance_desc">重要度が高い順</option>
                        <option value="priority_desc">優先度が高い順</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="panel list-panel">
            <div class="list-header">
                <h2>タスク一覧</h2>
                <p id="task-count-text" class="muted"></p>
            </div>
            <p id="empty-state" class="empty-state hidden">タスクがありません。左上のフォームから追加してください。</p>
            <ul id="task-list" class="task-list"></ul>
        </section>
    </div>

    <div id="task-detail-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="detail-modal-title">タスク詳細</h2>
                <button id="detail-modal-close-btn" type="button" class="btn btn-secondary">閉じる</button>
            </div>

            <div id="detail-modal-summary" class="detail-summary"></div>

            <div class="detail-grid">
                <section class="detail-panel">
                    <h3>詳細メモを追加</h3>
                    <form id="detail-note-form" class="stack">
                        <textarea id="detail-note-input" rows="3" maxlength="500" placeholder="進捗、対応履歴、気づきなどを追記"></textarea>
                        <button type="submit" class="btn btn-primary">メモを追加</button>
                    </form>
                    <ul id="detail-note-list" class="timeline-list"></ul>
                </section>

                <section class="detail-panel">
                    <h3>上司に質問</h3>
                    <form id="boss-question-form" class="stack">
                        <textarea id="boss-question-input" rows="3" maxlength="500" placeholder="確認したい内容や判断依頼を入力"></textarea>
                        <button type="submit" class="btn btn-primary">質問を追加</button>
                    </form>
                    <ul id="boss-question-list" class="timeline-list"></ul>
                </section>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
